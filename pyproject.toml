[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedformula"
version = "1.0.0"
description = "FedFORMULA — federated learning under label noise with a chemical foundation-model prior (modelling code: FM initialisation through federated training)"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = []          # pinned exactly in requirements-train.txt

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tox21_study*"]
